name: javadoc test
on: pull_request
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew javadoc
      - run: ls build/docs/javadoc | head && test -f build/docs/javadoc/index.html
