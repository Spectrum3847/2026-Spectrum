version: 2
updates:
  # Rust crate updates
  - package-ecosystem: "cargo"
    directory: "/rust"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    reviewers:
      - "Spectrum3847/2025-26"
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "deps(cargo)"

  # GitHub Actions workflow updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    reviewers:
      - "Spectrum3847/2025-26"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci:"
